# psql without the Ubuntu package mirrors: use the runner's preinstalled PostgreSQL client when present, otherwise a
# wrapper that runs psql from the official postgres:16 Docker image (the same image the pre-deploy DB tests already use;
# its digest is printed). No apt-get — security.ubuntu.com DNS failures broke `apt-get install postgresql-client`
# (exit 100) on 2026-11-11.
name: setup psql (no apt)
description: Make `psql` available without apt-get
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -e
        if command -v psql >/dev/null 2>&1; then echo "psql preinstalled: $(psql --version)"; exit 0; fi
        for d in /usr/lib/postgresql/*/bin; do [ -x "$d/psql" ] && { echo "$d" >> "$GITHUB_PATH"; echo "psql preinstalled: $("$d/psql" --version)"; exit 0; }; done
        docker pull -q postgres:16 >/dev/null
        echo "psql via Docker image postgres:16 $(docker image inspect postgres:16 --format '{{index .RepoDigests 0}}')"
        sudo tee /usr/local/bin/psql >/dev/null <<'SH'
        #!/usr/bin/env bash
        # psql from postgres:16; the working directory is mounted so -f / \ir paths work; PG* env vars are passed through
        exec docker run --rm -i --network host -v "$PWD:$PWD" -w "$PWD" $(env | grep -oE '^PG[A-Z_]+' | sed 's/^/-e /') postgres:16 psql "$@"
        SH
        sudo chmod +x /usr/local/bin/psql; psql --version
