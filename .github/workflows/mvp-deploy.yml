# EVA Video Studio MVP: test → deploy Modal (API + workers) → setup R2 + Stripe webhook → deploy the site to Vercel
# → live end-to-end purchase in a real browser (Stripe TEST mode only) with timings and cost.
# Needs repo secrets (Settings → Secrets and variables → Actions): MODAL_TOKEN_ID, MODAL_TOKEN_SECRET, R2_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, STRIPE_SECRET_KEY (sk_test_…), VERCEL_TOKEN; optional R2_BUCKET (default
# eva-video-studio), RESEND_API_KEY + EVA_MAIL_FROM (delivery email), ANTHROPIC_API_KEY (AI card planner).
name: mvp · deploy + live e2e
on:
  workflow_dispatch:
    inputs:
      e2e: { description: "Run the live browser purchase test", type: boolean, default: true }
  push:
    branches: [feat/mvp-launch]
    paths: [saas/**, site/**, engine/**, scripts/**, .github/workflows/mvp-deploy.yml]
concurrency: { group: mvp-deploy, cancel-in-progress: false }
# Security: no repository-level secrets. All credentials live in the GitHub Environment "production", whose deployment
# branch rule allows only feat/mvp-launch (later main), so no other branch, fork or workflow can read them.
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || 'eva-video-studio' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EVA_MAIL_FROM: ${{ secrets.EVA_MAIL_FROM }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: "3.12" }
      - name: Unit tests (planner, API state machine)
        run: |
          pip install -q starlette httpx requests numpy
          python saas/tests/test_planner.py && python saas/tests/test_api.py
      - name: Which accounts are configured
        id: have
        run: |
          echo "modal=$([ -n "$MODAL_TOKEN_ID" ] && [ -n "$R2_ACCOUNT_ID" ] && [ -n "$STRIPE_SECRET_KEY" ] && echo 1 || echo 0)" >> $GITHUB_OUTPUT
          echo "vercel=$([ -n "$VERCEL_TOKEN" ] && echo 1 || echo 0)" >> $GITHUB_OUTPUT
          case "$STRIPE_SECRET_KEY" in sk_test_*|rk_test_*) echo "stripe_test=1" >> $GITHUB_OUTPUT;; *) echo "stripe_test=0" >> $GITHUB_OUTPUT;; esac
          for v in MODAL_TOKEN_ID MODAL_TOKEN_SECRET R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY STRIPE_SECRET_KEY VERCEL_TOKEN RESEND_API_KEY ANTHROPIC_API_KEY; do
            [ -n "${!v}" ] && echo "secret $v: set" || echo "secret $v: MISSING"; done
      - name: Modal secrets + deploy
        if: steps.have.outputs.modal == '1'
        id: modal
        run: |
          pip install -q "modal~=1.0"
          modal secret create eva-r2 R2_ACCOUNT_ID="$R2_ACCOUNT_ID" R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" R2_BUCKET="$R2_BUCKET" --force
          modal secret create eva-stripe STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" --force
          modal secret create eva-mail RESEND_API_KEY="${RESEND_API_KEY:-none}" EVA_MAIL_FROM="${EVA_MAIL_FROM:-none}" EVA_SITE_URL="https://eva-video-studio.vercel.app" --force
          if [ -n "$ANTHROPIC_API_KEY" ]; then modal secret create eva-anthropic ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --force; export EVA_USE_LLM=1; fi
          t=$(date +%s); modal deploy saas/modal_app.py; echo "deploy_s=$(( $(date +%s) - t ))"
          API=$(python -c "import modal; print(modal.Function.from_name('eva-video-studio', 'api').get_web_url())")
          echo "api=$API" >> $GITHUB_OUTPUT; echo "API: $API"
          modal run saas/modal_app.py::setup --api-url "$API"
          curl -fsS "$API/api/health"; echo
      - name: Deploy site to Vercel
        if: steps.have.outputs.vercel == '1'
        id: site
        env: { API_URL: "${{ steps.modal.outputs.api }}" }
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python saas/music/compose.py /tmp/tracks --mp3 && mkdir -p site/demos/music && cp /tmp/tracks/*.mp3 site/demos/music/
          echo "window.EVA_API = \"$API_URL\";" > site/config.js
          npm i -g vercel@39 >/dev/null
          cd site && vercel link --yes --project eva-video-studio --token "$VERCEL_TOKEN"
          URL=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN"); echo "deployment: $URL"
          ORG=$(python -c "import json;print(json.load(open('.vercel/project.json'))['orgId'])")
          D=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/eva-video-studio/domains?teamId=$ORG" | python -c "import json,sys;d=json.load(sys.stdin).get('domains',[]);print(d[0]['name'] if d else '')" || true)
          [ -z "$D" ] && D=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/eva-video-studio/domains" | python -c "import json,sys;d=json.load(sys.stdin).get('domains',[]);print(d[0]['name'] if d else '')" || true)
          SITE=${D:+https://$D}; SITE=${SITE:-$URL}
          echo "site=$SITE" >> $GITHUB_OUTPUT; echo "SITE: $SITE"
      - name: Point delivery links at the site
        if: steps.have.outputs.modal == '1' && steps.have.outputs.vercel == '1'
        env: { SITE_URL: "${{ steps.site.outputs.site }}" }
        run: modal secret create eva-mail RESEND_API_KEY="${RESEND_API_KEY:-none}" EVA_MAIL_FROM="${EVA_MAIL_FROM:-none}" EVA_SITE_URL="$SITE_URL" --force
      - name: Live end-to-end tests (Stripe TEST mode, real uploads, real cloud renders)
        if: steps.have.outputs.modal == '1' && steps.have.outputs.vercel == '1' && steps.have.outputs.stripe_test == '1' && (github.event_name == 'push' || inputs.e2e)
        env: { SITE_URL: "${{ steps.site.outputs.site }}", API_URL: "${{ steps.modal.outputs.api }}" }
        run: |
          set -e
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q "playwright~=1.48" && python -m playwright install --with-deps chromium >/dev/null
          M=saas/tests/media; mkdir -p e2e
          # 1. the new 30 s 9:16 customer video: full purchase, HD delivered automatically
          V=$M/new30.mp4; [ -f $V ] || { echo "::warning::saas/tests/media/new30.mp4 missing; using the 20 s real-upload pair"; ffmpeg -loglevel error -y -i $M/education.mp4 -i $M/realestate.mp4 -filter_complex "[0:v]fps=30,scale=720:1280,setsar=1[a];[1:v]fps=30,scale=720:1280,setsar=1[b];[a][0:a][b][1:a]concat=n=2:v=1:a=1[v][au]" -map "[v]" -map "[au]" -c:v libx264 -crf 20 -c:a aac e2e/fallback.mp4; V=e2e/fallback.mp4; }
          python saas/tests/browser_e2e.py "$SITE_URL" $V e2e/purchase --aspect 9:16 --templates T17,T20,T01 --music mix
          # 2. paid render that fails (test-mode fault hook) → automatic retry → automatic full refund through Stripe
          cp $M/education.mp4 e2e/e2e-fail-final.mp4
          python saas/tests/browser_e2e.py "$SITE_URL" e2e/e2e-fail-final.mp4 e2e/refund --aspect 9:16 --templates T20 --music none --expect refunded
          # 3. security + privacy + rejection probes against the live API and bucket
          python saas/tests/live_checks.py "$API_URL" e2e/purchase/summary.json e2e/checks.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        if: always()
        with: { name: live-e2e, path: "e2e/**/*.json", if-no-files-found: ignore }   # public repo: JSON only, no videos/screens
      - name: Summary
        if: always()
        env: { SITE_URL: "${{ steps.site.outputs.site }}", API_URL: "${{ steps.modal.outputs.api }}" }
        run: |
          echo "API:  $API_URL"; echo "SITE: $SITE_URL"
          for f in e2e/*/summary.json e2e/checks.json; do [ -f "$f" ] && { echo "== $f"; cat "$f"; }; done; true
