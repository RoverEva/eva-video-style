# EVA Video Studio MVP: tests → deploy Modal (API + workers) → deploy the site to Vercel → pin CORS to the real domain →
# Stripe TEST webhook (signing secret straight into Modal Secrets) → verify R2 privacy/CORS → live browser purchase tests.
# Credentials: GitHub Environment "production" only (required reviewer + branch rule feat/mvp-launch): MODAL_TOKEN_ID,
# MODAL_TOKEN_SECRET, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, STRIPE_SECRET_KEY (rk_test_…/sk_test_…),
# VERCEL_TOKEN; optional R2_BUCKET, ANTHROPIC_API_KEY, RESEND_API_KEY + EVA_MAIL_FROM.
# Customer videos never pass through GitHub: once deployed, uploads, renders, payments and delivery run on Modal unattended.
name: mvp · deploy + live e2e
on:
  workflow_dispatch:
    inputs:
      e2e: { description: "Run the live browser purchase test", type: boolean, default: true }
  push:
    branches: [feat/mvp-launch]
    paths: [saas/**, site/**, engine/**, scripts/**, .github/workflows/mvp-deploy.yml]
concurrency: { group: mvp-deploy, cancel-in-progress: false }
# Security: no repository-level secrets. All credentials live in the GitHub Environment "production", whose deployment
# branch rule allows only feat/mvp-launch (later main), so no other branch, fork or workflow can read them.
permissions: { contents: read }
jobs:
  deploy:
    # trusted workflow only: this repository, this branch, never a fork or another branch's copy of the file
    if: github.repository == 'RoverEva/eva-video-style' && github.ref == 'refs/heads/feat/mvp-launch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || 'eva-video-studio' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EVA_MAIL_FROM: ${{ secrets.EVA_MAIL_FROM }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: "3.12" }
      - name: Unit + server-side post-payment tests (signed webhook events, order state, render job, delivery, render failure, retry, refund)
        run: |
          pip install -q "starlette~=0.41" "httpx~=0.27" "requests~=2.32" "numpy~=2.1"
          python saas/tests/test_planner.py && python saas/tests/test_api.py && python saas/tests/test_versions_qa.py
          # credits / free previews / library SQL on a throwaway Postgres 16 (same functions Supabase runs), incl. concurrency
          sudo apt-get install -y -qq postgresql-client >/dev/null
          docker run -d --name evapg -e POSTGRES_HOST_AUTH_METHOD=trust -p 54329:5432 postgres:16 >/dev/null
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 54329 -q && break; sleep 1; done
          psql -h 127.0.0.1 -p 54329 -U postgres -q -c "create role anon; create role authenticated; create role service_role;"
          EVA_PG_HOST=127.0.0.1 EVA_PG_PORT=54329 python saas/tests/test_db.py
      - name: Which accounts are configured
        id: have
        run: |
          echo "modal=$([ -n "$MODAL_TOKEN_ID" ] && [ -n "$R2_ACCOUNT_ID" ] && [ -n "$STRIPE_SECRET_KEY" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$SUPABASE_DB_URL" ] && echo 1 || echo 0)" >> $GITHUB_OUTPUT
          echo "vercel=$([ -n "$VERCEL_TOKEN" ] && echo 1 || echo 0)" >> $GITHUB_OUTPUT
          case "$STRIPE_SECRET_KEY" in sk_test_*|rk_test_*) echo "stripe_test=1" >> $GITHUB_OUTPUT;; *) echo "stripe_test=0" >> $GITHUB_OUTPUT;; esac
          for v in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL MODAL_TOKEN_ID MODAL_TOKEN_SECRET R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY STRIPE_SECRET_KEY VERCEL_TOKEN RESEND_API_KEY ANTHROPIC_API_KEY; do
            [ -n "${!v}" ] && echo "secret $v: set" || echo "secret $v: MISSING"; done
      - name: Supabase preflight on the PRODUCTION secrets — stops the deploy before anything changes
        # same check as staging-supabase-check.yml: secrets shape + project, DB connection, migration + 25 rules in a
        # ROLLED-BACK transaction, Auth sign-in links (one throwaway user, deleted). Nothing is kept.
        if: steps.have.outputs.modal == '1'
        env: { SUPABASE_PROJECT_REF: kaojcgfcwjhnrxppwikz, EVA_SITE_URL: "https://eva-video-studio.vercel.app" }
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          python3 saas/tests/supabase_staging_check.py
      - name: Database migration (Supabase Postgres, additive + idempotent, one transaction)
        if: steps.have.outputs.modal == '1'
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          for f in saas/db/[0-9]*.sql; do echo "applying $f"; psql "$(printf %s "$SUPABASE_DB_URL" | tr -d '[:space:]')" -v ON_ERROR_STOP=1 -q -1 -f "$f"; done
          psql "$(printf %s "$SUPABASE_DB_URL" | tr -d '[:space:]')" -At -c "select max(version) from public.eva_schema"
      - name: Modal secrets + deploy
        if: steps.have.outputs.modal == '1'
        id: modal
        run: |
          pip install -q "modal~=1.0" "requests~=2.32" "boto3~=1.35"
          c() { printf %s "$1" | tr -d '[:space:]'; }   # pasted secrets may carry newlines; keys never contain whitespace
          # known production origin goes to Modal BEFORE the first deploy (re-pinned below from Vercel's answer)
          SITE_PROD="https://eva-video-studio.vercel.app"
          python saas/tools/promote_gallery.py --copy   # approved Gallery assets staging → gallery/v1/ (server-side copy, staging kept)
          modal secret create eva-r2 R2_ACCOUNT_ID="$(c "$R2_ACCOUNT_ID")" R2_ACCESS_KEY_ID="$(c "$R2_ACCESS_KEY_ID")" R2_SECRET_ACCESS_KEY="$(c "$R2_SECRET_ACCESS_KEY")" R2_BUCKET="$(c "$R2_BUCKET")" --force >/dev/null
          modal secret create eva-stripe STRIPE_SECRET_KEY="$(c "$STRIPE_SECRET_KEY")" --force >/dev/null
          modal secret create eva-supabase SUPABASE_URL="$(c "$SUPABASE_URL")" SUPABASE_SERVICE_ROLE_KEY="$(c "$SUPABASE_SERVICE_ROLE_KEY")" --force >/dev/null
          modal secret create eva-mail RESEND_API_KEY="${RESEND_API_KEY:-none}" EVA_MAIL_FROM="${EVA_MAIL_FROM:-none}" --force >/dev/null
          modal secret create eva-config EVA_SITE_URL="$SITE_PROD" EVA_ALLOWED_ORIGINS="$SITE_PROD" EVA_GALLERY_PREFIX=gallery/v1/ --force >/dev/null
          python saas/deploy/stripe_webhook.py placeholder
          if [ -n "$ANTHROPIC_API_KEY" ]; then modal secret create eva-anthropic ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --force >/dev/null; echo "EVA_USE_LLM=1" >> $GITHUB_ENV; export EVA_USE_LLM=1; fi
          t=$(date +%s); modal deploy saas/modal_app.py; echo "first deploy: $(( $(date +%s) - t )) s"
          API=$(python -c "import modal; print(modal.Function.from_name('eva-video-studio', 'api').get_web_url())")
          echo "api=$API" >> $GITHUB_OUTPUT; echo "API: $API"
      - name: Deploy site to Vercel
        if: steps.have.outputs.modal == '1' && steps.have.outputs.vercel == '1'
        id: site
        env: { API_URL: "${{ steps.modal.outputs.api }}" }
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python saas/music/compose.py /tmp/tracks --mp3 && mkdir -p site/demos/music && cp /tmp/tracks/*.mp3 site/demos/music/
          printf 'window.EVA_API = "%s";\nwindow.EVA_SUPABASE_URL = "%s";\nwindow.EVA_SUPABASE_ANON = "%s";\n' "$API_URL" "$(printf %s "$SUPABASE_URL" | tr -d '[:space:]')" "$(printf %s "$SUPABASE_ANON_KEY" | tr -d '[:space:]')" > site/config.js   # anon key is public by design
          python saas/deploy/vercel_deploy.py site eva-video-studio   # REST API, no CLI; writes site= to GITHUB_OUTPUT
      - name: Pin CORS + links to the real site, Stripe webhook (secret → Modal secret manager), redeploy
        if: steps.have.outputs.modal == '1' && steps.have.outputs.vercel == '1'
        env: { SITE_URL: "${{ steps.site.outputs.site }}", API_URL: "${{ steps.modal.outputs.api }}" }
        run: |
          # exact origin reported by Vercel; Modal is redeployed below so every API container starts with it
          modal secret create eva-config EVA_SITE_URL="$SITE_URL" EVA_ALLOWED_ORIGINS="$SITE_URL" EVA_GALLERY_PREFIX=gallery/v1/ --force >/dev/null
          echo "API CORS origin: $SITE_URL"
          python saas/deploy/stripe_webhook.py sync "$API_URL"
          modal deploy saas/modal_app.py >/dev/null && echo "redeployed with final secrets"
          modal run saas/modal_app.py::setup
          curl -fsS "$API_URL/api/health"; echo
      - name: Smoke test - API CORS for /api/uploads + signed R2 upload (gate for the browser test)
        if: steps.have.outputs.modal == '1' && steps.have.outputs.vercel == '1'
        env: { SITE_URL: "${{ steps.site.outputs.site }}", API_URL: "${{ steps.modal.outputs.api }}" }
        run: |
          for i in 1 2 3; do python saas/tests/smoke_cors.py "$API_URL" "$SITE_URL" && exit 0; echo "retry $i in 20 s (containers may still be starting)"; sleep 20; done; exit 1
      - name: Verify R2 is private and its CORS allows only the site
        if: steps.have.outputs.modal == '1' && steps.have.outputs.vercel == '1'
        env: { SITE_URL: "${{ steps.site.outputs.site }}" }
        run: |
          B="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com/$R2_BUCKET"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$B/uploads/probe.mp4"); echo "unsigned GET: HTTP $code"; [ "$code" -ge 400 ] || { echo "::error::bucket answered an unsigned request"; exit 1; }
          pre() { curl -s -o /dev/null -D - -X OPTIONS "$B/uploads/probe.mp4" -H "Origin: $1" -H "Access-Control-Request-Method: PUT" -H "Access-Control-Request-Headers: content-type" | tr -d '\r' | grep -i '^access-control-allow-origin:' || true; }
          ok=$(pre "$SITE_URL"); bad=$(pre "https://evil.example")
          echo "site origin  → ${ok:-none}"; echo "other origin → ${bad:-none}"
          if [ -z "$ok" ] || [ -n "$bad" ]; then
            echo "::error::Set the R2 bucket CORS policy (Cloudflare → R2 → eva-video-studio → Settings → CORS) to:"
            echo "[{\"AllowedOrigins\":[\"$SITE_URL\"],\"AllowedMethods\":[\"PUT\",\"GET\",\"HEAD\"],\"AllowedHeaders\":[\"content-type\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]"
            exit 1
          fi
      - name: Live end-to-end tests (real upload + cloud preview on Modal, Stripe TEST Checkout opens, privacy/security probes)
        if: steps.have.outputs.modal == '1' && steps.have.outputs.vercel == '1' && steps.have.outputs.stripe_test == '1' && (github.event_name == 'push' || inputs.e2e)
        env: { SITE_URL: "${{ steps.site.outputs.site }}", API_URL: "${{ steps.modal.outputs.api }}" }
        run: |
          set -e
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q "playwright~=1.48" && python -m playwright install --with-deps chromium >/dev/null
          python saas/tests/test_checkout_opened.py   # offline: checkout-opened + Stripe session verification logic
          M=saas/tests/media; mkdir -p e2e
          # test clip: the new 30 s 9:16 video
          # private test clip: R2 testdata/new30.mp4 (upload it in the Cloudflare dashboard) or saas/tests/media/new30.mp4
          pip install -q "boto3~=1.35" && python -c "import sys; sys.path.insert(0,'saas/web'); import store; s=store.R2(); s.size('testdata/new30.mp4') and s.download('testdata/new30.mp4','e2e/new30.mp4')" || true
          V=e2e/new30.mp4; [ -f $V ] || V=$M/new30.mp4; [ -f $V ] || { echo "::warning::saas/tests/media/new30.mp4 missing; using the 20 s real-upload pair"; ffmpeg -loglevel error -y -i $M/education.mp4 -i $M/realestate.mp4 -filter_complex "[0:v]fps=30,scale=720:1280,setsar=1[a];[1:v]fps=30,scale=720:1280,setsar=1[b];[a][0:a][b][1:a]concat=n=2:v=1:a=1[v][au]" -map "[v]" -map "[au]" -c:v libx264 -crf 20 -c:a aac e2e/fallback.mp4; V=e2e/fallback.mp4; }
          # 1. account features on the deployed stack (throwaway test users, deleted afterwards): lifetime free previews,
          #    real Modal renders, cached ASR, privacy, failure release, Stripe TEST top-up session, HD export, concurrency
          python saas/tests/live_accounts_e2e.py "$API_URL" "$SITE_URL" $V e2e/accounts.json
          # 1b. Template Gallery on the live site (gallery/v1/): cards, 5 s + 15 s demos both aspects, T19 absent, signed links
          python saas/tests/browser_gallery.py "$SITE_URL" e2e/gallery
          # 2. security + privacy + rejection probes against the live API and bucket
          python saas/tests/live_checks.py "$API_URL" e2e/purchase/summary.json e2e/checks.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        if: always()
        with: { name: live-e2e, path: "e2e/**/*.json", if-no-files-found: ignore }   # public repo: JSON only, no videos/screens
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        if: failure()
        with:   # Stripe test-mode page only, private video token redacted; public repo → kept 3 days
          name: stripe-checkout-diagnostics
          path: |
            e2e/**/stripe_fail.png
            e2e/**/stripe_fail.html
          if-no-files-found: ignore
          retention-days: 3
      - name: Summary
        if: always()
        env: { SITE_URL: "${{ steps.site.outputs.site }}", API_URL: "${{ steps.modal.outputs.api }}" }
        run: |
          echo "API:  $API_URL"; echo "SITE: $SITE_URL"
          for f in e2e/*/summary.json e2e/checks.json; do [ -f "$f" ] && { echo "== $f"; cat "$f"; }; done; true
