# QA module tests on the production face detector: same base image, FFmpeg/fonts (Debian bookworm apt), Node and
# Playwright, and OpenCV pin as saas/Dockerfile (opencv-python-headless >=4.10,<5, which ships the Haar cascade).
# torch / eva-asr are left out (QA does not use them). No credentials, no deployment.
name: qa · tests (production detector)
on:
  workflow_dispatch:
  push:
    branches: [feat/video-qa]
    paths: [qa/**, scripts/render.mjs, scripts/assemble.sh, engine/**, .github/workflows/qa-tests.yml]
permissions: { contents: read }
concurrency:
  group: qa-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: python:3.12-slim-bookworm
    env: { DEBIAN_FRONTEND: noninteractive, PIP_NO_CACHE_DIR: "1", FONTSDIR: /usr/share/fonts, EVA_QA_CACHE: "off" }
    steps:
      - name: System packages (as saas/Dockerfile)
        run: |
          apt-get update && apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-inter fonts-noto-cjk \
            fonts-noto-cjk-extra fonts-noto-color-emoji curl ca-certificates git xz-utils
          curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz | tar -xJ -C /usr/local --strip-components=1
          fc-cache -f
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { persist-credentials: false }
      - name: Python + Node deps (as saas/Dockerfile)
        run: |
          pip install numpy pillow "opencv-python-headless>=4.10,<5" "pytest~=8.3"
          python -c "import cv2, os; p = cv2.data.haarcascades + 'haarcascade_frontalface_default.xml'; assert os.path.isfile(p) and not cv2.CascadeClassifier(p).empty(); print('opencv', cv2.__version__, 'haar ok')"
          python -c "from qa import face; print('QA face backend:', face.Detector().name)"
          npm install --omit=dev --no-audit --no-fund && npx playwright install --with-deps chromium
          ffmpeg -version | head -1
      - name: QA tests (all 40)
        run: mkdir -p out && python -m pytest -q -rfEs -p no:cacheprovider --basetemp=out/pytest qa/tests 2>&1 | tee out-pytest.log; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        if: always()
        with:
          name: qa-tests
          if-no-files-found: ignore
          path: |
            out-pytest.log
            out/pytest/**/qa-report.json
            out/pytest/**/evidence/*.jpg
      - name: Face diagnostics (Haar candidates and tracking per sample, failing fixtures)
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import cv2, numpy as np, tempfile
          from pathlib import Path
          from qa import media, face as F
          d = Path(tempfile.gettempdir()) / "eva-qa-fixtures-v2"; det = F.Detector(); c = det._d
          src = media.Source(str(d / "src.mp4"))
          for vid in ("good_clean", "t26_bad_clean", "crop_gone_clean"):
              out = media.read_frames(str(d / f"{vid}.mp4"), range(0, 150, 15))
              print(f"== {vid}")
              for n, o in out.items():
                  s = src.frames_at([n / 30])[n / 30]; H, W = s.shape[:2]; k = 360 / W
                  g = cv2.cvtColor(cv2.resize(s, (360, int(round(H * k))), interpolation=cv2.INTER_AREA), cv2.COLOR_BGR2GRAY)
                  b, _, w = c.detectMultiScale3(g, scaleFactor=1.1, minNeighbors=6, minSize=(24, 24), outputRejectLevels=True)
                  cands = [(tuple(int(v / k) for v in bb), round(float(np.ravel(ww)[0]), 1)) for bb, ww in zip(b, w)]
                  pick = det.detect(s); m = F.track(s, pick, o) if pick else None
                  mm = {kk: (round(v, 3) if isinstance(v, float) else v) for kk, v in (m or {}).items() if kk in ("score", "scale", "aspect", "out_frac", "inframe", "box")}
                  print(n, "cands", cands, "pick", tuple(int(v) for v in pick) if pick else None, "track", mm)
          PY
