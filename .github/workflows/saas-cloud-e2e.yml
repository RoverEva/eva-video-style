# Phase 1 acceptance: run one real cloud job (eva-asr → plan → render → captions → music → MP4) on Modal.
# Actions tab → "saas · cloud end-to-end test" → Run workflow → paste a link to a NEW 30–60 s talking-head MP4.
name: saas · cloud end-to-end test
on:
  workflow_dispatch:
    inputs:
      video_url: { description: "Direct link to a 30-60 s landscape talking-head MP4", required: true }
      templates: { description: "T17,T20,T01,T09 (comma separated)", default: "T17,T20" }
      mode: { description: "single | multi | auto", default: "multi" }
      music: { description: "auto | manual | none", default: "auto" }
      preview: { description: "15 s watermarked preview only", type: boolean, default: false }
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      EVA_USE_LLM: ${{ vars.EVA_USE_LLM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install modal
      - name: Run one cloud job
        run: |
          set -o pipefail
          modal run saas/modal_app.py --video "${{ inputs.video_url }}" --templates "${{ inputs.templates }}" \
            --mode "${{ inputs.mode }}" --music "${{ inputs.music }}" ${{ inputs.preview && '--preview' || '' }} 2>&1 | tee e2e.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cloud-e2e-log, path: e2e.log }
