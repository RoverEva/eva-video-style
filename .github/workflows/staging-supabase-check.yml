# Staging check of the real Supabase project WITHOUT changing it: connectivity, migration 001 applied twice + credits /
# 3 lifetime free previews / My Videos / lockdown checks inside one ROLLED-BACK transaction, Auth sign-in links for the
# site pages with one throwaway user (deleted at the end). No deploy, no Modal, no Stripe, no R2.
# Needs the four SUPABASE_* secrets in GitHub Environment "staging" (branch rule: feat/saas-accounts).
name: staging · Supabase check (rolled back, no deploy)
on:
  workflow_dispatch: {}
  push:   # only when the check itself or the migration changes (dispatch needs the file on the default branch)
    branches: [feat/saas-accounts]
    paths: [saas/tests/supabase_staging_check.py, saas/db/**, .github/workflows/staging-supabase-check.yml]
permissions: { contents: read }
jobs:
  supabase:
    if: github.repository == 'RoverEva/eva-video-style' && github.ref == 'refs/heads/feat/saas-accounts'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      EVA_SITE_URL: https://eva-video-studio.vercel.app
      SUPABASE_PROJECT_REF: kaojcgfcwjhnrxppwikz   # public (dashboard URL); used to catch a wrong SUPABASE_URL
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { persist-credentials: false }
      - name: Mask secret-derived values
        run: |
          for v in SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL; do [ -n "${!v}" ] && echo "::add-mask::${!v}"; done
          # the DB password, whatever the URL looks like (no URL parsing that could fail): text between the first ':' after
          # '://' and the last '@'
          python3 - <<'PY'
          import os
          u = os.environ.get("SUPABASE_DB_URL", "").strip(); rest = u.split("://", 1)[-1]; cred = rest.rpartition("@")[0]
          pw = cred.split(":", 1)[1] if ":" in cred else ""
          for x in {pw, pw.strip("[]")} - {""}: print(f"::add-mask::{x}")
          PY
      - name: SUPABASE_DB_URL shape (yes/no facts only — never the value)
        run: |
          python3 - <<'PY'
          import os, re
          raw = os.environ.get("SUPABASE_DB_URL", ""); u = raw.strip()
          scheme, _, rest = u.partition("://"); cred, at, hostpart = rest.rpartition("@")
          hostport = hostpart.split("/", 1)[0].split("?", 1)[0]
          facts = {
            "scheme": scheme if scheme in ("postgres", "postgresql") else "unexpected",
            "leading/trailing whitespace or newline": raw != u, "whitespace inside": bool(re.search(r"\s", u)),
            "has '@' separator": bool(at), "'@' count": u.count("@"),
            "square brackets in user:password part": "[" in cred or "]" in cred,
            "square brackets around host": hostport.startswith("["),
            "placeholder text left (YOUR-PASSWORD / YOUR_PASSWORD / [REF])": bool(re.search(r"YOUR[-_ ]?PASSWORD|\[REF\]|PROJECT[-_]REF", u, re.I)),
            "host is a Supabase pooler": "pooler.supabase.com" in hostport, "host is db.<ref>.supabase.co": bool(re.match(r"\[?db\.[a-z0-9]+\.supabase\.co", hostport)),
            "port": (hostport.rsplit(":", 1)[1] if ":" in hostport.lstrip("[").split("]")[-1] else "none"),
            "user looks like postgres.<ref>": bool(re.match(r"postgres\.[a-z0-9]{20}:", cred + ":")),
          }
          for k, v in facts.items(): print(f"{k}: {v}")
          PY
      - name: psql client
        run: which psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client); psql --version
      - name: Supabase check (database, rolled-back migration + business rules, Auth)
        run: python3 saas/tests/supabase_staging_check.py
      - name: Summary
        if: always()
        run: |
          { echo '### Supabase staging check'; echo '```'; cat supabase_check.json 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
