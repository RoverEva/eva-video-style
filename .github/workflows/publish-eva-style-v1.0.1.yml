# Publishes the open-source EVA Video Style v1.0.1 Release (Eva approved 2026-11-11). Runs only after approval.
# Builds EVA-Core.zip reproducibly from the merged release source (codex/v1.0-source-only-rc @ 3755ead, PRs #3 + #5)
# with build_core.py and requires it to equal the committed SHA256SUMS byte for byte; copies the 23 unchanged
# template ZIPs from v1.0.0 and verifies all 24 checksums; smoke-installs Core + T03; checks the basic workflow runs
# with no model/provider key (optional AI-assisted workflows such as Opus 5.5 or Codex stay allowed); creates tag
# v1.0.1 + the Release; re-downloads and re-verifies every asset. v1.0.0 is never modified. Only GITHUB_TOKEN is used.
name: open source · publish EVA Video Style v1.0.1
on:
  push:
    branches: [feat/mvp-launch]
    paths: [.github/workflows/publish-eva-style-v1.0.1.yml]
permissions: { contents: write }
jobs:
  publish:
    if: github.repository == 'RoverEva/eva-video-style' && github.ref == 'refs/heads/feat/mvp-launch'
    runs-on: ubuntu-24.04
    environment: production   # approval gate only; no environment secret is read
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SRC: 3755eade416e4617224109a9febd51afa9ab97b3
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { persist-credentials: false, ref: 3755eade416e4617224109a9febd51afa9ab97b3, path: src }
      - name: Verify the release source
        working-directory: src
        run: |
          test "$(git rev-parse HEAD)" = "$SRC"
          sha256sum -c --quiet SOURCE_MANIFEST.sha256 && sha256sum -c --quiet EVA-Core/checksums.sha256
          grep -q '"version": "1.0.1"' EVA-Core/core.json
          grep -q 'LIMITS = {"min_seconds": 3.0}' EVA-Core/core/pipeline.py
          echo "source OK: Core 1.0.1, no fixed duration cap"
      - name: Build and verify all 24 assets
        run: |
          # Canonical, host-independent build (stored members); must equal the committed SHA256SUMS byte for byte
          mkdir assets && cd src && python3 -B EVA-Core/tools/packages/build_core.py ../assets --check SHA256SUMS
          cp SHA256SUMS download-manifest.json ../assets/ && cd ../assets
          gh release download v1.0.0 -R "$GITHUB_REPOSITORY" -p 'T??-1.0.0.zip'
          sha256sum -c SHA256SUMS
          test "$(grep -c . SHA256SUMS)" = 24 && test "$(ls *.zip | wc -l)" = 24
          python3 -c "import json,hashlib; m=json.load(open('download-manifest.json')); assert m['core']['version']=='1.0.1' and m['core']['sha256']==hashlib.sha256(open('EVA-Core.zip','rb').read()).hexdigest(); print('manifest OK')"
      - name: Smoke install (Core 1.0.1 + T03 1.0.0)
        run: |
          python3 -B src/EVA-Core/tools/packages/install.py --root "$RUNNER_TEMP/eva/root" install-core assets/EVA-Core.zip > /dev/null
          python3 -B src/EVA-Core/tools/packages/install.py --root "$RUNNER_TEMP/eva/root" install-template assets/T03-1.0.0.zip --id T03 --version 1.0.0 > /dev/null
          python3 -B src/EVA-Core/tools/packages/install.py --root "$RUNNER_TEMP/eva/root" list | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['core']['version']=='1.0.1' and d['templates'][0]['id']=='T03'; print('install OK')"
      - name: Basic workflow needs no model or provider key (installed Core 1.0.1 + T03, empty environment)
        run: |
          # Functional check: the basic Core + template workflow (SRT → transcript → local Content Planner) runs with NO
          # model/provider key and no network-capable env; Core code reads no provider key.
          set -e
          ROOT="$RUNNER_TEMP/eva/root"; W="$(mktemp -d)"
          python3 - "$W" <<'PY'
          import sys
          from pathlib import Path
          d = Path(sys.argv[1]); cues = []
          for n in range(15):   # 45 s of sentence-sized cues
              t = .5 + 3 * n; f = lambda x: f"00:00:{int(x):02},{int(round((x % 1) * 1000)):03}"
              cues.append(f"{n + 1}\n{f(t)} --> {f(t + 2.4)}\nThis is part {n + 1} of a complete talk about editing videos.\n")
          (d / "talk.srt").write_text("\n".join(cues))
          PY
          env -i PATH="$PATH" HOME="$W" PYTHONDONTWRITEBYTECODE=1 python3 -c "import sys; sys.path.insert(0, '$ROOT/EVA-Core/core'); from srt_input import write_outputs; write_outputs('$W/talk.srt', '$W/talk')"
          env -i PATH="$PATH" HOME="$W" PYTHONDONTWRITEBYTECODE=1 python3 "$ROOT/EVA-Core/core/planner.py" "$W/talk.transcript.js" "$W/job" \
            --duration 45.5 --install-root "$ROOT" --templates T03 --aspect 9:16 > "$W/planner.log" 2>&1
          python3 - "$W/job/plan.json" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1])); end = p["sections"][-1]["t1"]
          assert abs(end - 45.5) < .01, end
          print(f"planner OK without any API key: source={p['planner']['source']}, {len(p['sections'])} section(s) to {end} s, {len(p.get('cards', []))} cards")
          PY
          if grep -rnE 'os\.environ(\.get)?\(?\[?"(ANTHROPIC|OPENAI|GEMINI|GOOGLE_API|CLAUDE)[A-Z_]*' "$ROOT/EVA-Core/core" "$ROOT/EVA-Core/scripts" "$ROOT/EVA-Core/qa"; then
            echo "::error::Core code reads a model-provider key"; exit 1; fi
          echo "no provider key is read by Core code (optional AI-assisted workflows in docs are unaffected)"
      - name: Create tag v1.0.1 and the Release
        run: |
          cat > notes.md <<'MD'
          ## EVA Core 1.0.1: no fixed duration limit

          Use **EVA Core + one or more templates + your own video** to produce a complete edited video, locally.

          - **Whole input:** EVA Core edits the complete video (minimum 3 seconds), with no fixed duration or file-size cap. Transcription (or your SRT), planning, the 10-second chunked render with global timestamps, continuous audio and captions, and QA all cover the source through to its ending. Core 1.0.0 wrongly enforced the hosted EVA Video Studio launch limits (30.5 s, 200 MB).
          - **No model requirement:** the basic workflow needs no Anthropic API key and no specific Claude model. The Content Planner runs locally.
          - **Optional host policy:** `--max-seconds` / `--max-bytes`, default no limit. An over-limit input is rejected before any work; nothing is cropped, sped up or summarised.
          - **Preview:** `--preview-seconds` is no longer capped at 30. The final render is always full length.
          - **New regression test:** `EVA-Core/core/tests/test_duration.py`, using synthetic media only. A 45 s input renders to 45.00 s, with audio and captions to the ending.

          ### Assets
          - **`EVA-Core.zip` 1.0.1:** built deterministically from `codex/v1.0-source-only-rc` @ 3755ead. sha256 `cc801a0656d9ae5fedd49ed2a2d549db50747241f5ef7b789405f9f2e72723b8`, reproducible on any host (stored members; `EVA-Core/tools/packages/build_core.py`).
          - **The 23 template ZIPs:** unchanged from v1.0.0 and compatible (`core >=1.0.0 <2.0.0`).
          - **Checksums:** `SHA256SUMS` and `download-manifest.json` updated.

          The historical **v1.0.0** tag and its assets are unchanged.
          MD
          if gh release view v1.0.1 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "::error::v1.0.1 already exists; not overwriting"; exit 1; fi
          gh release create v1.0.1 assets/* -R "$GITHUB_REPOSITORY" --target "$SRC" --latest \
            --title "EVA Video Style v1.0.1 — EVA Core 1.0.1 (no fixed duration limit)" --notes-file notes.md
      - name: Re-download and verify the published assets
        run: |
          mkdir check && cd check && gh release download v1.0.1 -R "$GITHUB_REPOSITORY"
          sha256sum -c SHA256SUMS && cmp download-manifest.json ../assets/download-manifest.json
          git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" 'refs/tags/v1.0.1*' | grep -q "^$SRC" && echo "tag v1.0.1 → $SRC"
          gh release view v1.0.0 -R "$GITHUB_REPOSITORY" --json assets -q '.assets[]|select(.name=="EVA-Core.zip")|.size' | grep -q . && echo "v1.0.0 untouched"
          gh release view v1.0.1 -R "$GITHUB_REPOSITORY" --json url -q .url
