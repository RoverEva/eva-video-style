# ONE-OFF, Eva-requested (2026-11-11): copy the ORIGINAL upload + cached transcript/face data of Eva's own test project
# pa04f1da3d9d (the 5-template job diagnosed in Phase A) into a PRIVATE workflow artifact kept for 1 day, so Phase B can
# re-render exactly the same clip with the fixed planner on the development branch. R2 GET only; nothing is written to
# R2, Supabase, Modal or Stripe; nothing is printed except file names and sizes. The artifact is deleted after download.
name: production · fetch Eva's test source (read-only, 1-day private artifact)
on:
  push:
    branches: [feat/mvp-launch]
    paths: [.github/workflows/production-fetch-test-source.yml]
permissions: { contents: read }
jobs:
  fetch:
    if: github.repository == 'RoverEva/eva-video-style' && github.ref == 'refs/heads/feat/mvp-launch'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      PID: pa04f1da3d9d
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || 'eva-video-studio' }}
    steps:
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: "3.12" }
      - name: Download (GET only)
        run: |
          pip install -q "boto3~=1.35"
          python3 - <<'PY'
          import os, boto3
          s3 = boto3.client("s3", endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID'].strip()}.r2.cloudflarestorage.com",
                            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"].strip(), aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"].strip(), region_name="auto")
          B, P = os.environ["R2_BUCKET"].strip(), os.environ["PID"]
          os.makedirs("src/cache/srt", exist_ok=True)
          keys = [o["Key"] for o in s3.list_objects_v2(Bucket=B, Prefix=f"uploads/{P}/").get("Contents", [])]
          keys += [o["Key"] for o in s3.list_objects_v2(Bucket=B, Prefix=f"projects/{P}/cache/").get("Contents", [])]
          for k in keys:
              dest = "src/input" + os.path.splitext(k)[1] if k.startswith("uploads/") else "src/cache/" + k.split("/cache/", 1)[1]
              os.makedirs(os.path.dirname(dest), exist_ok=True); s3.download_file(B, k, dest); print(dest, os.path.getsize(dest), "bytes")
          PY
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with: { name: eva-test-source-pa04f1da3d9d, path: src, retention-days: 1, if-no-files-found: error }
