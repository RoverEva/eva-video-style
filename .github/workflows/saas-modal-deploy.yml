# Deploy EVA Video Studio to Modal (no local machine involved). Needs repo secrets MODAL_TOKEN_ID / MODAL_TOKEN_SECRET.
name: saas · deploy to Modal
on:
  workflow_dispatch:
  push:
    branches: ["feat/saas-*"]
    paths: ["saas/**", "engine/**", "scripts/**", "package.json"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      EVA_USE_LLM: ${{ vars.EVA_USE_LLM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install modal
      - run: python saas/tests/test_planner.py
      - run: modal deploy saas/modal_app.py
