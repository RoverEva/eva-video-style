# STAGING site for sign-in testing: separate Vercel project "eva-video-studio-staging" (production project untouched),
# same site code as feat/saas-accounts, real Supabase Auth (magic link via Custom SMTP), no API backend (EVA_API empty:
# rendering/payments are off here — login, redirect, session and logout only). Environment "staging" only.
# Needs in GitHub env "staging": VERCEL_TOKEN (+ VERCEL_SCOPE if a team), SUPABASE_URL, SUPABASE_ANON_KEY.
# Supabase → Auth → URL configuration → Redirect URLs: add https://eva-video-studio-staging.vercel.app/**
name: staging · site (Vercel staging project)
on:
  workflow_dispatch: {}
  push:
    branches: [release/v1-launch]
    paths: [site/**, saas/tests/browser_templates.py, saas/tests/browser_i18n.py, saas/tests/staging_shots.py, saas/tests/browser_staging_login.py, .github/workflows/staging-site.yml]
permissions: { contents: write }   # only to push review screenshots to the staging-previews branch
jobs:
  site:
    if: github.repository == 'RoverEva/eva-video-style' && github.ref == 'refs/heads/release/v1-launch'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}   # optional; else found by name
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}   # test step only (throwaway user)
      VERCEL_DOMAIN: eva-video-studio-staging.vercel.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { persist-credentials: false }
      - name: Staging config
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN is not in the staging environment"; exit 1; }
          c() { printf %s "$1" | tr -d '[:space:]'; }
          printf 'window.EVA_API = "";\nwindow.EVA_STAGING = true;\nwindow.EVA_SUPABASE_URL = "%s";\nwindow.EVA_SUPABASE_ANON = "%s";\n' "$(c "$SUPABASE_URL")" "$(c "$SUPABASE_ANON_KEY")" > site/config.js
          # keep search engines out of staging
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("site/vercel.json"); j = json.loads(p.read_text()) if p.exists() else {}
          j.setdefault("headers", []).append({"source": "/(.*)", "headers": [{"key": "X-Robots-Tag", "value": "noindex, nofollow"}]})
          p.write_text(json.dumps(j, indent=1))
          PY
      - id: deploy
        run: pip install -q "requests~=2.32" && python saas/deploy/vercel_deploy.py site eva-video-studio-staging --existing-only
      - name: Browser check — magic link → staging, session persists, sign out
        env: { SITE: "${{ steps.deploy.outputs.site }}" }
        run: |
          pip install -q "playwright~=1.48" && python -m playwright install chromium >/dev/null
          # system libraries via apt: best effort (the runner already has most; apt mirrors were unreachable on 2026-11-11)
          sudo env PATH="$PATH" python -m playwright install-deps chromium >/dev/null 2>&1 || echo "::warning::playwright install-deps failed; using the runner's libraries"
          python saas/tests/browser_staging_login.py
      - name: Homepage on staging — logo, favicon, 9:16 + 16:9 demos, phone layout (browser checks)
        if: always()
        env: { SITE: "${{ steps.deploy.outputs.site }}" }
        run: python saas/tests/browser_hero.py "$SITE" /tmp/hero
      - name: Gallery + Pricing on staging (browser checks)
        if: always()
        env: { SITE: "${{ steps.deploy.outputs.site }}" }
        run: python saas/tests/browser_templates.py "$SITE"
      - name: English / 简体中文 on staging (browser checks)
        if: always()
        env: { SITE: "${{ steps.deploy.outputs.site }}" }
        run: python saas/tests/browser_i18n.py "$SITE"
      - name: Review screenshots → branch staging-previews (PNG only, no code)
        if: always()
        env: { SITE: "${{ steps.deploy.outputs.site }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          python saas/tests/staging_shots.py "$SITE" /tmp/shots || true
          ls /tmp/shots/*.png >/dev/null 2>&1 || exit 0
          cd /tmp/shots && git init -q && git checkout -q -b staging-previews && git add *.png
          git -c user.name=eva-staging-bot -c user.email=eva-staging-bot@users.noreply.github.com commit -qm "Staging previews of ${GITHUB_SHA::7} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" staging-previews
