# Release branch check, NO deployment and NO credentials: builds the worker image (saas/Dockerfile, the image Modal runs),
# runs the QA module's own tests, then real account-version renders with QA (real eva-asr): preview + HD export of two
# real uploads, pre- and post-render QA in report mode, face detector / model assets inside the image.
name: release · worker image + QA (no deploy)
on:
  workflow_dispatch:
  push:
    branches: [feat/saas-accounts]
    paths: [qa/**, saas/**, scripts/**, engine/**, .dockerignore, .github/workflows/qa-image-verify.yml]
permissions: { contents: read }
concurrency: { group: qa-image-verify, cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { shell: bash } }   # -eo pipefail: a failing command fails the step even when piped
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { persist-credentials: false }
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build worker image
        run: |
          t=$(date +%s); docker build -f saas/Dockerfile -t eva-worker . ; echo "image build $(( $(date +%s) - t )) s"
      - name: QA module tests inside the image
        run: |
          docker run --rm -v $PWD:/src -w /src eva-worker sh -c "pip install -q 'pytest~=8.3' && python -m pytest -q -rfEs qa/tests" 2>&1 | tail -40
      - name: Real renders with QA (education 9:16 T17+T20, real estate 16:9 T20+T01)
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --cpus 4 -v $PWD/saas/tests/media:/media:ro -v $PWD/out:/out eva-worker python3 saas/tests/image_qa_check.py /media/education.mp4 /out/education --aspect 9:16 --templates T17,T20
          docker run --rm --cpus 4 -v $PWD/saas/tests/media:/media:ro -v $PWD/out:/out eva-worker python3 saas/tests/image_qa_check.py /media/realestate.mp4 /out/realestate --aspect 16:9 --templates T20,T01
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        if: always()
        with: { name: qa-image-verify, path: "out/*/summary.json", if-no-files-found: ignore }
