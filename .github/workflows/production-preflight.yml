# READ-ONLY check of the PRODUCTION credentials before release. Nothing is deployed, migrated, created or charged:
#   Supabase (EVA_READ_ONLY=1): secrets/project, DB connection in a READ-ONLY session (selects only; migration testing
#             stays in staging), Auth health/settings + admin API read — no test user, no writes
#   Stripe TEST key, R2 (private bucket, exact gallery listing, no T19), Vercel token, Modal token (lists apps), Resend (optional)
# Code: the reviewed release-candidate commit pinned below (feat/mvp-launch itself is unchanged apart from this file).
# Starts when this file is pushed or by hand, only from feat/mvp-launch (the production environment's branch rule), after Eva approves the run.
name: production · read-only preflight
on:
  workflow_dispatch:
  push:
    branches: [feat/mvp-launch]
    paths: [.github/workflows/production-preflight.yml]
permissions: { contents: read }
concurrency: { group: mvp-deploy, cancel-in-progress: false }   # never overlaps a deploy
jobs:
  preflight:
    if: github.repository == 'RoverEva/eva-video-style' && github.ref == 'refs/heads/feat/mvp-launch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || 'eva-video-studio' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EVA_MAIL_FROM: ${{ secrets.EVA_MAIL_FROM }}
      EVA_READ_ONLY: "1"
      SUPABASE_PROJECT_REF: kaojcgfcwjhnrxppwikz
      EVA_SITE_URL: https://eva-video-studio.vercel.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { persist-credentials: false, ref: 36884b614d011a5826855e869213aea2dd23067c }   # feat/saas-accounts, read-only code
      - name: psql without apt (inline copy of .github/actions/setup-psql — the checkout above is pinned code)
        run: |
          set -e
          if command -v psql >/dev/null 2>&1; then echo "psql preinstalled: $(psql --version)"; exit 0; fi
          for d in /usr/lib/postgresql/*/bin; do [ -x "$d/psql" ] && { echo "$d" >> "$GITHUB_PATH"; echo "psql preinstalled: $("$d/psql" --version)"; exit 0; }; done
          docker pull -q postgres:16 >/dev/null
          echo "psql via Docker image postgres:16 $(docker image inspect postgres:16 --format '{{index .RepoDigests 0}}')"
          sudo tee /usr/local/bin/psql >/dev/null <<'SH'
          #!/usr/bin/env bash
          # psql from postgres:16; the working directory is mounted so -f / \ir paths work; PG* env vars are passed through
          exec docker run --rm -i --network host -v "$PWD:$PWD" -w "$PWD" $(env | grep -oE '^PG[A-Z_]+' | sed 's/^/-e /') postgres:16 psql "$@"
          SH
          sudo chmod +x /usr/local/bin/psql; psql --version
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: "3.12" }
      - name: Supabase (read-only)
        id: supa
        continue-on-error: true
        run: |
          # psql: provided by .github/actions/setup-psql (no apt)
          python3 saas/tests/supabase_staging_check.py
      - name: Stripe TEST · R2 · Vercel · Resend
        id: rest
        continue-on-error: true
        run: python3 saas/tests/production_preflight.py
      - name: Modal token (lists production apps only)
        id: modal
        continue-on-error: true
        run: |
          pip install -q "modal~=1.0"
          modal app list --env main | sed -n '1,12p'
      - name: Result
        run: |
          echo "supabase=${{ steps.supa.outcome }} stripe/r2/vercel/resend=${{ steps.rest.outcome }} modal=${{ steps.modal.outcome }}"
          test "${{ steps.supa.outcome }}${{ steps.rest.outcome }}${{ steps.modal.outcome }}" = "successsuccesssuccess"
