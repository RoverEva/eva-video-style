# READ-ONLY check of the PRODUCTION credentials before release. Nothing is deployed, migrated, created or charged:
#   Supabase: secrets/project, DB connection, migration 001 + 25 rules inside a ROLLED-BACK transaction, Auth sign-in
#             links (one throwaway user, deleted) — the same check the deploy runs first
#   Stripe TEST key, R2 (private bucket, exact gallery listing, no T19), Vercel token, Modal token (lists apps), Resend (optional)
# Runs only by hand, only from feat/mvp-launch (the production environment's branch rule), after Eva approves the run.
name: production · read-only preflight
on: workflow_dispatch
permissions: { contents: read }
concurrency: { group: mvp-deploy, cancel-in-progress: false }   # never overlaps a deploy
jobs:
  preflight:
    if: github.repository == 'RoverEva/eva-video-style' && github.ref == 'refs/heads/feat/mvp-launch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || 'eva-video-studio' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EVA_MAIL_FROM: ${{ secrets.EVA_MAIL_FROM }}
      SUPABASE_PROJECT_REF: kaojcgfcwjhnrxppwikz
      EVA_SITE_URL: https://eva-video-studio.vercel.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: "3.12" }
      - name: Supabase (rolled back, nothing kept)
        id: supa
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          python3 saas/tests/supabase_staging_check.py
      - name: Stripe TEST · R2 · Vercel · Resend
        id: rest
        continue-on-error: true
        run: python3 saas/tests/production_preflight.py
      - name: Modal token (lists production apps only)
        id: modal
        continue-on-error: true
        run: |
          pip install -q "modal~=1.0"
          modal app list --env main | sed -n '1,12p'
      - name: Result
        run: |
          echo "supabase=${{ steps.supa.outcome }} stripe/r2/vercel/resend=${{ steps.rest.outcome }} modal=${{ steps.modal.outcome }}"
          test "${{ steps.supa.outcome }}${{ steps.rest.outcome }}${{ steps.modal.outcome }}" = "successsuccesssuccess"
