# Real sign-in email in staging: Supabase Custom SMTP → Resend → Resend's test inbox (delivered+…@resend.dev), Resend
# delivery log, then sign-in with the emailed link. One throwaway user, deleted. No deploy, no migration, no database writes.
# Secrets (GitHub Environment "staging"): SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY; optional RESEND_API_KEY
# (Full access — needed to read the delivery log and the emailed link).
name: staging · sign-in email delivery
on:
  workflow_dispatch: {}
  push:
    branches: [feat/saas-accounts]
    paths: [saas/tests/email_delivery_check.py, .github/workflows/staging-email-check.yml]
permissions: { contents: read }
jobs:
  email:
    if: github.repository == 'RoverEva/eva-video-style' && github.ref == 'refs/heads/feat/saas-accounts'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EVA_SITE_URL: https://eva-video-studio.vercel.app
      EVA_MAIL_DOMAIN: evavideostudio.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { persist-credentials: false }
      - run: python3 saas/tests/email_delivery_check.py
