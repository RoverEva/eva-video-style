# STAGING configuration check, before the Opus 5.5 proof render. No render, no Anthropic API call, no customer data.
# 1. lists Modal environments and whether the secrets eva-anthropic-staging / eva-r2 exist in each (names only; Modal
#    never shows secret values)
# 2. checks in the code that only the staging render/ping functions attach eva-anthropic-staging, and fetch/publish only eva-r2
# 3. starts two tiny containers with those secrets and reports booleans only: key present, key format (sk-ant-...),
#    stray whitespace, and that no Stripe/Supabase/R2/mail variables reach the render container. The key is never printed.
name: staging · secret check for the Opus proof (no render, no API call)
on:
  push:
    branches: [feat/mvp-launch]
    paths: [.github/workflows/staging-secret-check.yml]
permissions: { contents: read }
jobs:
  check:
    if: github.repository == 'RoverEva/eva-video-style' && github.ref == 'refs/heads/feat/mvp-launch'
    runs-on: ubuntu-24.04
    environment: production   # holds the Modal token only
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { persist-credentials: false, ref: feat/render-coverage }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: "3.12" }
      - run: pip install -q "modal~=1.0"
      - name: Where the secrets exist (names only)
        run: |
          python3 - <<'PY'
          import json, subprocess
          def j(*a): return json.loads(subprocess.run(["modal", *a, "--json"], check=True, capture_output=True, text=True).stdout or "[]")
          envs = [e.get("name") or e.get("Name") for e in j("environment", "list")]
          found = {}
          for e in envs:
              names = {(s.get("name") or s.get("Name")) for s in j("secret", "list", "--env", e)}
              found[e] = [n for n in ("eva-anthropic-staging", "eva-r2") if n in names]
              print(f"environment {e!r}: " + (", ".join(found[e]) or "neither secret"))
          pick = lambda n, pref: next((e for e in pref + envs if n in found.get(e, [])), "")
          a = pick("eva-anthropic-staging", ["staging"]); r = pick("eva-r2", [a])
          print(f"eva-anthropic-staging → environment {a or 'NOT FOUND'}; eva-r2 → environment {r or 'NOT FOUND'}")
          open("envs.sh", "w").write(f"A_ENV={a}\nR_ENV={r}\n")
          PY
      - name: Code check (which function gets which secret)
        run: |
          python3 - <<'PY'
          import ast
          t = ast.parse(open("saas/staging/proof_app.py").read()); want = {"fetch": ["R2_SECRET"], "publish": ["R2_SECRET"], "cleanup": ["R2_SECRET"],
               "render": ["ANTHROPIC_SECRET"], "ping": ["ANTHROPIC_SECRET"], "check_anthropic": ["ANTHROPIC_SECRET"], "check_r2": ["R2_SECRET"]}
          bad = 0
          for f in [n for n in t.body if isinstance(n, ast.FunctionDef)]:
              for d in f.decorator_list:
                  for k in getattr(d, "keywords", []):
                      if k.arg == "secrets":
                          got = [x.id for x in k.value.elts]; ok = got == want.get(f.name); bad += not ok
                          print(f"{f.name}: {got} {'ok' if ok else 'UNEXPECTED'}")
          src = open("saas/staging/proof_app.py").read()
          print("secret names in code:", "eva-anthropic-staging" in src and "eva-r2" in src, "| production secrets referenced:", any(s in src for s in ('"eva-anthropic"', "eva-stripe", "eva-supabase", "eva-db")))
          raise SystemExit(bad)
          PY
      - name: Container check (booleans only, no API call)
        run: |
          . ./envs.sh
          [ -n "$A_ENV" ] && [ -n "$R_ENV" ] || { echo "::error::a secret was not found (see above)"; exit 1; }
          EVA_ANTHROPIC_SECRET_ENV="$A_ENV" EVA_R2_SECRET_ENV="$R_ENV" modal run -q --env "$A_ENV" saas/staging/proof_app.py --check-only > out.txt 2>&1 || true
          grep -E '^CHECK ' out.txt | tee check.txt || { echo "Modal messages (no values):"; grep -iE "error|secret|environment|not found" out.txt | grep -v "sk-ant" | tail -15; }
          grep -q '"key_present": true' check.txt && grep -q '"key_format_ok": true' check.txt && grep -q '"other_service_vars_in_render": \[\]' check.txt \
            && grep -q '"r2_vars_present": true' check.txt && grep -q '"anthropic_key_in_storage_containers": false' check.txt \
            && echo "SECRET CHECK PASS (app environment $A_ENV, R2 secret from $R_ENV)" || { echo "::error::secret check failed (see CHECK line)"; exit 1; }
